[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supercharged-coral"
version = "0.1.0"
description = "Self-improving home security AI platform optimized for Google Coral Edge TPU"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Supercharged Coral Contributors" }]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
edge-tpu = ["pycoral>=2.0"]
training = [
  "tensorflow>=2.16",
  "torch>=2.3",
  "onnx>=1.16",
  "tensorboard>=2.16",
]
dashboard = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
supercharged-coral = "supercharged_coral.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

