database_path: data/home-supercharged-coral.db
object_classes:
  - Person
  - Package
  - Dog
  - Cat
  - Car
  - Truck
  - Motorcycle
  - Bicycle
  - Bird
motion:
  algorithm: frame_differencing
  threshold: 30
  min_area: 500
  blur_kernel: 5
  morphology_kernel: 5
cameras:
  - id: driveway
    source_type: rtsp
    uri: "rtsp://${CAMERA_RTSP_USERNAME}:${CAMERA_RTSP_PASSWORD}@192.168.50.128:554/cam/realmonitor?channel=1&subtype=0"
    fps: 8
    reconnect_attempts: 10
  - id: mailbox
    source_type: rtsp
    uri: "rtsp://${CAMERA_RTSP_USERNAME}:${CAMERA_RTSP_PASSWORD}@192.168.50.10:554/cam/realmonitor?channel=1&subtype=0"
    fps: 8
    reconnect_attempts: 10
  - id: back
    source_type: rtsp
    uri: "rtsp://${CAMERA_RTSP_USERNAME}:${CAMERA_RTSP_PASSWORD}@192.168.50.110:554/cam/realmonitor?channel=1&subtype=0"
    fps: 8
    reconnect_attempts: 10
  - id: front
    source_type: rtsp
    uri: "rtsp://${CAMERA_RTSP_USERNAME}:${CAMERA_RTSP_PASSWORD}@192.168.50.162:554/cam/realmonitor?channel=1&subtype=0"
    fps: 8
    reconnect_attempts: 10
